# Minimal CI (M1 / T1): Next.js quality gate + scoped pytest.
# Triggers are path-limited to avoid unrelated churn.

name: CI

on:
  push:
    branches: [main, master]
    paths:
      - ".github/workflows/ci.yml"
      - "quantum-oracle-ui/**"
      - "app/**"
      - "tests/**"
      - "requirements.txt"
      - "run_api.py"
  pull_request:
    branches: [main, master]
    paths:
      - ".github/workflows/ci.yml"
      - "quantum-oracle-ui/**"
      - "app/**"
      - "tests/**"
      - "requirements.txt"
      - "run_api.py"

jobs:
  frontend:
    name: quantum-oracle-ui (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: quantum-oracle-ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: quantum-oracle-ui/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  python-tests:
    name: Python (pytest tests/)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          grep -v 'liboqs' requirements.txt > /tmp/reqs.txt
          pip install --no-cache-dir -r /tmp/reqs.txt
      - name: Run pytest
        run: pytest tests/ -v
