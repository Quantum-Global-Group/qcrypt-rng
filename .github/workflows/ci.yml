name: CI

on:
  push:
    branches: [main, master]
    paths:
      - 'app/**'
      - 'tests/**'
      - 'quantum-oracle-ui/**'
      - 'requirements.txt'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main, master]
    paths:
      - 'app/**'
      - 'tests/**'
      - 'quantum-oracle-ui/**'
      - 'requirements.txt'
      - '.github/workflows/ci.yml'

jobs:
  frontend:
    name: Frontend lint & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: quantum-oracle-ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: quantum-oracle-ui/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build

  python-tests:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest-cov
      - name: Run tests with coverage
        run: pytest tests/ -v --cov=app --cov-fail-under=55 --cov-report=term-missing
        env:
          # Allow liboqs to be optional in CI
          LIBOQS_ENABLED: "false"