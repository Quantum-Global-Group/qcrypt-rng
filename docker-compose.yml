# Uses root Dockerfile (HF Spaces stack: Nginx + FastAPI + Next on 7860).
# Golden path for day-to-day dev: `python run_api.py` + `cd quantum-oracle-ui && npm run dev`.
# Streamlit is lab-only — not in this stack; see docs/planning/STREAMLIT_DECISION.md.
version: '3.8'

services:
  api:
    build: .
    ports:
      - "7860:7860"
    environment:
      - ENVIRONMENT=production
      - DEBUG=false
      - DATABASE_URL=postgresql://qcrypt:password@db:5432/qcrypt_db
      - REDIS_URL=redis://redis:6379/0
      - REQUIRE_API_KEY=true
      - ENABLE_USAGE_TRACKING=true
      - LOG_LEVEL=INFO
    depends_on:
      - db
      - redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7860/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_DB=qcrypt_db
      - POSTGRES_USER=qcrypt
      - POSTGRES_PASSWORD=password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    restart: unless-stopped

  # Streamlit `dashboard.py` is lab-only and not installed in the root image; see
  # docs/planning/STREAMLIT_DECISION.md. Run locally: pip install streamlit && streamlit run dashboard.py

volumes:
  postgres_data: