# k8s/dashboard-deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: qcrypt-dashboard
  namespace: qcrypt-rng
  labels:
    app: qcrypt-dashboard
spec:
  replicas: 2
  selector:
    matchLabels:
      app: qcrypt-dashboard
  template:
    metadata:
      labels:
        app: qcrypt-dashboard
    spec:
      containers:
      - name: dashboard
        image: qcrypt-rng:latest
        command: ["streamlit", "run", "dashboard.py", "--server.address", "0.0.0.0", "--server.port", "8501"]
        ports:
        - containerPort: 8501
        env:
        - name: API_BASE_URL
          value: "http://qcrypt-api-service:80"
        livenessProbe:
          httpGet:
            path: /
            port: 8501
          initialDelaySeconds: 60
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /
            port: 8501
          initialDelaySeconds: 30
          periodSeconds: 10
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"

---
apiVersion: v1
kind: Service
metadata:
  name: qcrypt-dashboard-service
  namespace: qcrypt-rng
spec:
  selector:
    app: qcrypt-dashboard
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8501
  type: LoadBalancer