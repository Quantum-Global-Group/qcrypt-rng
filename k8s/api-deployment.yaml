# k8s/api-deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: qcrypt-api
  namespace: qcrypt-rng
  labels:
    app: qcrypt-api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: qcrypt-api
  template:
    metadata:
      labels:
        app: qcrypt-api
    spec:
      containers:
      - name: api
        image: qcrypt-rng:latest
        ports:
        - containerPort: 8000
        env:
        - name: ENVIRONMENT
          value: "production"
        - name: DEBUG
          value: "false"
        - name: DATABASE_URL
          value: "postgresql://qcrypt:$(DB_PASSWORD)@postgres-service:5432/qcrypt_db"
        - name: REDIS_URL
          value: "redis://redis-service:6379/0"
        - name: REQUIRE_API_KEY
          value: "true"
        - name: ENABLE_USAGE_TRACKING
          value: "true"
        - name: LOG_LEVEL
          value: "INFO"
        - name: API_HOST
          value: "0.0.0.0"
        - name: API_PORT
          value: "8000"
        envFrom:
        - secretRef:
            name: postgres-secret
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 60
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"

---
apiVersion: v1
kind: Service
metadata:
  name: qcrypt-api-service
  namespace: qcrypt-rng
spec:
  selector:
    app: qcrypt-api
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8000
  type: LoadBalancer